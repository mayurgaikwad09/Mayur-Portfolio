<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Outer Rounded Container matching Bento Navy Dark Theme -->
  <rect width="64" height="64" rx="16" fill="#070a13"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1324" stroke="url(#bentoGlow)" stroke-width="2"/>
  
  <!-- "MG" Clean Monogram Typography -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="url(#mgGradient)" 
    font-family="'JetBrains Mono', 'Inter', system-ui, -apple-system, sans-serif" 
    font-size="26" 
    font-weight="900" 
    letter-spacing="-1"
  >MG</text>
  
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="bentoGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- MG Monogram Gradient -->
    <linearGradient id="mgGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
</svg>